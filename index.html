<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Place Name Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #2d3436;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 2.8rem;
            color: #1a1a1a;
            font-weight: 600;
            font-size: 1.75rem;
            letter-spacing: -0.5px;
            text-align: center;
        }

        .name-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            max-width: 480px;
            margin-bottom: 3rem;
        }

        .name-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 1.15rem 0.9rem;
            position: relative;
            transition: all 0.25s ease;
            border: 1px solid #e9ecef;
            cursor: text;
        }

        .name-box:hover {
            border-color: #ced4da;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }

        .name-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #212529;
            font-size: 1.05rem;
            font-weight: 500;
            text-align: center;
            outline: none;
            letter-spacing: 0.2px;
            cursor: text;
        }

        .save-btn {
            position: absolute;
            top: 7px;
            right: 7px;
            background-color: #495057;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s ease;
        }

        .name-box:hover .save-btn {
            opacity: 1;
            transform: scale(1);
        }

        .save-btn:hover {
            background-color: #212529;
        }

        .bottom-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.1rem;
            width: 100%;
            max-width: 480px;
        }

        .options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.55rem;
        }

        .option-btn {
            background-color: #e9ecef;
            color: #495057;
            border: none;
            padding: 0.4rem 0.95rem;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 9999px;
            transition: all 0.25s ease;
        }

        .option-btn:hover {
            background-color: #dee2e6;
        }

        .option-btn.active {
            background-color: #343a40;
            color: #ffffff;
        }

        .buttons-row {
            display: flex;
            justify-content: center;
            gap: 0.9rem;
            width: 100%;
        }

        #generate-btn,
        #view-saved-btn {
            border: none;
            padding: 0.85rem 1.6rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 9999px;
            transition: all 0.25s ease;
            flex: 1;
            max-width: 200px;
        }

        #generate-btn {
            background-color: #212529;
            color: #ffffff;
        }

        #generate-btn:hover {
            background-color: #000000;
            transform: translateY(-1px);
        }

        #view-saved-btn {
            background-color: #e9ecef;
            color: #343a40;
        }

        #view-saved-btn:hover {
            background-color: #dee2e6;
            transform: translateY(-1px);
        }

        #saved-count {
            position: fixed;
            bottom: 24px;
            left: 24px;
            font-size: 0.85rem;
            color: #6c757d;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 14px;
            border-radius: 9999px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(6px);
            animation: fadeIn 0.25s ease;
        }

        .modal-content {
            background-color: #ffffff;
            margin: 5% auto;
            padding: 40px;
            border-radius: 20px;
            width: 92%;
            max-width: 720px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
            animation: slideUp 0.3s ease;
        }

        .close {
            color: #adb5bd;
            float: right;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
            margin-top: -8px;
        }

        .close:hover {
            color: #212529;
        }

        #saved-names-text {
            width: 100%;
            min-height: 230px;
            background-color: #fafafa;
            color: #212529;
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 20px;
            font-family: inherit;
            font-size: 1.02rem;
            line-height: 1.6;
            resize: vertical;
            margin: 18px 0 24px;
        }

        #saved-names-text:focus {
            outline: none;
            border-color: #ced4da;
            background-color: #ffffff;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        #update-saved-names,
        #copy-saved-names {
            border: none;
            padding: 0.75rem 1.7rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #update-saved-names {
            background-color: #212529;
            color: white;
        }

        #update-saved-names:hover {
            background-color: #000;
        }

        #copy-saved-names {
            background-color: #e9ecef;
            color: #343a40;
        }

        #copy-saved-names:hover {
            background-color: #dee2e6;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 520px) {
            body {
                padding: 28px 16px;
            }

            h1 {
                font-size: 1.45rem;
                margin-bottom: 2rem;
            }

            .name-container {
                max-width: 100%;
                gap: 0.85rem;
            }

            .name-box {
                padding: 1rem 0.75rem;
            }

            .buttons-row {
                gap: 0.7rem;
            }

            #generate-btn,
            #view-saved-btn {
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }

            .modal-content {
                padding: 28px 20px;
                margin: 8% auto;
            }
        }
    </style>
</head>
<body>

    <h1>Advanced Place Name Generator</h1>

    <div class="name-container">
        <div class="name-box">
            <input type="text" class="name-input">
            <button class="save-btn">✓</button>
        </div>
        <div class="name-box">
            <input type="text" class="name-input">
            <button class="save-btn">✓</button>
        </div>
        <div class="name-box">
            <input type="text" class="name-input">
            <button class="save-btn">✓</button>
        </div>
        <div class="name-box">
            <input type="text" class="name-input">
            <button class="save-btn">✓</button>
        </div>
    </div>

    <div class="bottom-controls">
        <div class="options">
            <button class="option-btn active" data-type="normal">Normal</button>
            <button class="option-btn" data-type="two-part">Two-Part</button>
            <button class="option-btn" data-type="short">Short</button>
            <button class="option-btn" data-type="long">Long</button>
        </div>

        <div class="buttons-row">
            <button id="generate-btn">Generate Names</button>
            <button id="view-saved-btn">View Saved Names</button>
        </div>
    </div>

    <div id="saved-count">Saved Names: 0</div>

    <div id="saved-names-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 style="margin: 0 0 4px 0; font-size: 1.4rem; font-weight: 600; color: #1a1a1a;">Saved Names</h2>
            <textarea id="saved-names-text"></textarea>
            <div class="modal-actions">
                <button id="copy-saved-names">Copy</button>
                <button id="update-saved-names">Update List</button>
            </div>
        </div>
    </div>

    <script>
        const prefixes = [
            "Ael", "Aer", "Al", "An", "Ar", "Ash", "Bel", "Bri", "Cael", "Cal", "Cel", "Cor", "Dael", "Dar", "Del",
            "Eld", "El", "Ely", "Fael", "Fen", "Gal", "Gwen", "Hal", "Ith", "Kael", "Kel", "Lor", "Lyn", "Mal",
            "Mir", "Mor", "Nal", "Ner", "Or", "Quel", "Rav", "Rey", "Sar", "Sel", "Syl", "Thal", "Thor", "Val",
            "Vel", "Vor", "Wyn", "Xan", "Yel", "Zan", "Zha"
        ];

        const middles = [
            "an", "ar", "en", "er", "ia", "iel", "in", "ion", "ir", "is", "ith", "or", "oth", "ul", "un", "ur",
            "yn", "ys", "ae", "ei", "ai", "oa", "ua", "dra", "drae", "lith", "mir", "nor", "riel", "ther", "vyn"
        ];

        const suffixes = [
            "a", "ae", "an", "ar", "ath", "en", "er", "ia", "iel", "in", "ion", "is", "ith", "or", "os", "oth",
            "ul", "um", "us", "yn", "ys", "ara", "aria", "elle", "ora", "oria", "wyn", "eth", "iel", "ith",
            "wood", "haven", "mere", "fell", "ridge", "vale", "moor", "crest", "spire", "reach", "hold"
        ];

        const natureWords = [
            "Ash", "Birch", "Cedar", "Elder", "Fern", "Frost", "Glen", "Hawk", "Iron", "Jade", "Lake", "Mist",
            "Oak", "Pine", "River", "Shadow", "Silver", "Stone", "Storm", "Thorn", "Willow", "Wolf", "Moon",
            "Star", "Sun", "Sky", "Cloud", "Rain", "Snow", "Wind", "Fire", "Ember", "Crystal", "Amber"
        ];

        const darkWords = [
            "Black", "Bleak", "Blood", "Bone", "Dark", "Dread", "Gloom", "Grim", "Hollow", "Night", "Raven",
            "Shade", "Sorrow", "Thorn", "Void", "Wraith", "Grave", "Crypt", "Doom", "Fell"
        ];

        const elegantWords = [
            "Aether", "Azure", "Celestia", "Elysia", "Lumina", "Seraph", "Solara", "Vespera", "Aurora",
            "Celene", "Elara", "Lyra", "Nova", "Orion", "Sable", "Silva", "Vera", "Zara"
        ];

        let savedNamesArray = [];
        let currentType = 'normal';

        function randomFrom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateUniqueName() {
            const style = Math.random();

            if (style < 0.35) {
                return randomFrom(prefixes) + randomFrom(middles) + randomFrom(suffixes);
            } else if (style < 0.55) {
                return randomFrom(natureWords) + randomFrom(suffixes);
            } else if (style < 0.70) {
                return randomFrom(darkWords) + randomFrom(middles) + randomFrom(["a", "e", "ia", "is", "or", "yn"]);
            } else if (style < 0.85) {
                return randomFrom(elegantWords);
            } else {
                return randomFrom(prefixes) + randomFrom(middles) + randomFrom(middles).slice(0, 2) + randomFrom(suffixes);
            }
        }

        function generateName(type) {
            switch (type) {
                case 'two-part':
                    return `${generateUniqueName()} ${generateUniqueName()}`;
                case 'short':
                    let short = generateUniqueName();
                    return short.length > 6 ? short.slice(0, 6) : short;
                case 'long':
                    const longPrefixes = ["New", "Old", "Great", "High", "Deep", "Far", "North", "South", "East", "West", "Upper", "Lower"];
                    return `${randomFrom(longPrefixes)} ${generateUniqueName()}${Math.random() > 0.6 ? ' ' + generateUniqueName() : ''}`;
                default:
                    return generateUniqueName();
            }
        }

        const generateBtn = document.getElementById('generate-btn');
        const nameInputs = document.querySelectorAll('.name-input');
        const optionBtns = document.querySelectorAll('.option-btn');
        const savedCount = document.getElementById('saved-count');
        const viewSavedBtn = document.getElementById('view-saved-btn');
        const modal = document.getElementById('saved-names-modal');
        const closeBtn = document.querySelector('.close');
        const savedNamesText = document.getElementById('saved-names-text');
        const updateSavedNamesBtn = document.getElementById('update-saved-names');
        const copySavedNamesBtn = document.getElementById('copy-saved-names');

        optionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                optionBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
            });
        });

        generateBtn.addEventListener('click', () => {
            nameInputs.forEach(input => {
                input.value = generateName(currentType);
                input.readOnly = false;
            });
        });

        document.querySelectorAll('.save-btn').forEach((btn, index) => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const input = nameInputs[index];
                if (input.value.trim() !== '') {
                    savedNamesArray.push(input.value.trim());
                    savedCount.textContent = `Saved Names: ${savedNamesArray.length}`;
                    btn.style.backgroundColor = '#28a745';
                    setTimeout(() => {
                        btn.style.backgroundColor = '#495057';
                    }, 1100);
                }
            });
        });

        // Click anywhere on the name box to edit easily
        document.querySelectorAll('.name-box').forEach((box, index) => {
            box.addEventListener('click', () => {
                const input = nameInputs[index];
                input.readOnly = false;
                input.focus();
                const len = input.value.length;
                input.setSelectionRange(len, len);
            });
        });

        viewSavedBtn.addEventListener('click', () => {
            savedNamesText.value = savedNamesArray.join(', ');
            modal.style.display = 'block';
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        updateSavedNamesBtn.addEventListener('click', () => {
            const updatedNames = savedNamesText.value.split(',').map(n => n.trim()).filter(n => n !== '');
            savedNamesArray = updatedNames;
            savedCount.textContent = `Saved Names: ${savedNamesArray.length}`;
            modal.style.display = 'none';
        });

        copySavedNamesBtn.addEventListener('click', async () => {
            const text = savedNamesText.value;
            if (!text.trim()) return;

            try {
                await navigator.clipboard.writeText(text);
                copySavedNamesBtn.textContent = "Copied!";
                setTimeout(() => {
                    copySavedNamesBtn.textContent = "Copy";
                }, 1600);
            } catch (err) {
                savedNamesText.select();
                document.execCommand('copy');
                copySavedNamesBtn.textContent = "Copied!";
                setTimeout(() => {
                    copySavedNamesBtn.textContent = "Copy";
                }, 1600);
            }
        });

        // Generate initial names
        nameInputs.forEach(input => {
            input.value = generateName('normal');
        });
    </script>
</body>
</html>
